name: Compilar EXE para Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install TikTokLive edge-tts pygame psutil pyinstaller flask
        
    - name: Compilar ejecutable
      run: |
        pyinstaller --noconsole --onefile patobot.py
        
    - name: Subir Ejecutable
      uses: actions/upload-artifact@v4
      with:
        name: TikTok-TTS-Panel
        path: dist/patobot.exe
        
