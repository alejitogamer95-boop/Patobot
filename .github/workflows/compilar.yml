name: Compilar EXE para Windows

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Instalar librerias y compilar
      run: |
        python -m pip install --upgrade pip
        pip install TikTokLive edge-tts pygame pyinstaller
        pyinstaller --noconsole --onefile newfile.py
    - name: Subir Ejecutable
      uses: actions/upload-artifact@v3
      with:
        name: TikTok-TTS-Panel
        path: dist/app.exe
        
