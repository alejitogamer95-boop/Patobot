name: Compilar PatoBot

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar librerías
        run: |
          pip install TikTokLive edge-tts pygame psutil flask yt-dlp pyinstaller

      - name: Compilar ejecutable
        run: |
          pyinstaller --noconsole --onefile --name PatoBot PatoBot_v1.4.7.py

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: PatoBot_v1.4.7
          path: dist/PatoBot_v1.4.7.exe
