on: [push]

jobs:
build:
runs-on: windows-latest
steps:
- uses: actions/checkout@v4

- name: Configurar Python  
  uses: actions/setup-python@v5  
  with:  
    python-version: '3.10'  
      
- name: Instalar librerias  
  run: |  
    python -m pip install --upgrade pip  
    pip install TikTokLive edge-tts pygame psutil yt_dlp flask pyinstaller  
      
- name: Compilar ejecutable  
  run: |  
    pyinstaller --noconsole --onefile PatoBot_V1.4.6beta.py  
      
- name: Subir Ejecutable  
  uses: actions/upload-artifact@v4  
  with:  
    name: TikTok-TTS-Panel  
    path: dist/patobot.exe
    
