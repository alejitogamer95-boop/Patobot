name: Compilar PatoBot

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Desinstalar versiones anteriores
        run: |
          python -m pip uninstall -y TikTokLive edge-tts pygame psutil flask yt-dlp pyinstaller
        continue-on-error: true

      - name: Instalar últimas versiones
        run: |
          python -m pip install --upgrade TikTokLive
          python -m pip install --upgrade edge-tts
          python -m pip install --upgrade pygame
          python -m pip install --upgrade psutil
          python -m pip install --upgrade flask
          python -m pip install --upgrade yt-dlp
          python -m pip install --upgrade pyinstaller

      - name: Ver versiones instaladas
        run: |
          python --version
          python -m pip --version
          python -m pip show TikTokLive
          python -m pip show edge-tts
          python -m pip show pygame
          python -m pip show psutil
          python -m pip show flask
          python -m pip show yt-dlp
          python -m pip show pyinstaller

      - name: Limpiar compilación anterior
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }

          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }

          if (Test-Path PatoBot.spec) {
            Remove-Item PatoBot.spec -Force
          }

      - name: Compilar ejecutable
        run: |
          python -m PyInstaller --noconsole --onefile --clean --name PatoBot PatoBot_v1.5.py

      - name: Comprobar ejecutable
        shell: pwsh
        run: |
          if (!(Test-Path "dist\PatoBot.exe")) {
            Write-Error "No se creó PatoBot.exe"
            exit 1
          }

          Get-Item "dist\PatoBot.exe"

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: PatoBot_v1.5
          path: dist/PatoBot.exe
          if-no-files-found: error
