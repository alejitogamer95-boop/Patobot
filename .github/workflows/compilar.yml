name: Compilar PatoBot

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install TikTokLive
          pip install edge-tts
          pip install pygame
          pip install psutil
          pip install flask
          pip install pyinstaller

      - name: Comprobar sintaxis
        run: |
          python -m py_compile PatoBot.py
          python -m py_compile 01_imports.py
          python -m py_compile 02_widgets.py
          python -m py_compile 03_config.py
          python -m py_compile 04_spotify.py
          python -m py_compile 05_gui.py
          python -m py_compile 06_audio.py
          python -m py_compile 07_permissions.py
          python -m py_compile 08_music.py
          python -m py_compile 09_tiktok.py

      - name: Compilar ejecutable
        run: |
          pyinstaller --noconsole --onefile --name PatoBot PatoBot.py

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-TTS-Panel
          path: dist/PatoBot.exe
